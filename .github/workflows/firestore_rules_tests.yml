name: Firestore Rules Tests

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore-tests/**'
      - '.github/workflows/firestore_rules_tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run rules unit tests against emulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: npm install
        working-directory: firestore-tests

      - name: Run rules tests against the Firestore emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project sira-transport-test "npm --prefix firestore-tests test"
